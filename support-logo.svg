<?xml version="1.0" encoding="UTF-8"?>
<!-- Customer service / headset logo (SVG). Scalable, single-file icon. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" aria-labelledby="title desc" role="img">
  <title id="title">Customer Support</title>
  <desc id="desc">Headset with microphone inside a rounded badge and SUPPORT text</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffdd57"/>
      <stop offset="1" stop-color="#ff7a18"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Badge circle -->
  <g filter="url(#shadow)">
    <circle cx="60" cy="52" r="38" fill="url(#g)" />
  </g>

  <!-- Headset band -->
  <path d="M28 60c0-17.67 14.33-32 32-32s32 14.33 32 32" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.98" />

  <!-- Earcups -->
  <rect x="20" y="64" width="12" height="18" rx="3" ry="3" fill="#fff" opacity="0.95" transform="translate(0,-4)" />
  <rect x="88" y="64" width="12" height="18" rx="3" ry="3" fill="#fff" opacity="0.95" transform="translate(0,-4)" />

  <!-- Microphone stem -->
  <path d="M86 80c0 0-5-2-8-2-4 0-8 3-10 6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
  <circle cx="84" cy="86" r="3.2" fill="#fff" />

  <!-- Head silhouette (inner) -->
  <path d="M42 60a18 18 0 0 1 36 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

  <!-- Lower badge rectangle for text -->
  <rect x="22" y="92" width="76" height="18" rx="9" ry="9" fill="#111" opacity="0.9" />
  <text x="60" y="106" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#fff" font-weight="700" text-anchor="middle" alignment-baseline="middle">SUPPORT</text>

  <!-- Make sure icon is crisp on small sizes -->
</svg>