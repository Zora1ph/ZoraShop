<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zora.ph | Official Earring Shop</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000;
            color: #fff;
            scroll-behavior: smooth;
        }

        .modern-bold {
            font-family: 'Archivo Black', sans-serif;
            text-transform: uppercase;
            letter-spacing: -0.05em;
            line-height: 0.9;
        }

        body::-webkit-scrollbar {
            display: none;
        }

        .product-card {
            background: #000;
            border: 1px solid #1a1a1a;
            transition: .3s ease;
        }

        .product-card:hover {
            border-color: white;
        }

        .img-container {
            background: white;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #admin-panel {
            display: none;
            background: black;
            border: 1px solid white;
            margin-top: 50px;
        }

        input, textarea, select {
            background: black;
            border: 1px solid #333;
            color: white;
            border-radius: 0;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: white;
            outline: none;
        }

        #welcome-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.98);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .payment-badge {
            background: black;
            padding: 5px 12px;
            font-size: 10px;
            font-weight: 900;
            border: 1px solid #333;
        }
    </style>
</head>

<body class="p-4">

<!-- WELCOME MODAL -->
<div id="welcome-modal">
    <div class="border border-white p-8 max-w-sm w-full text-center bg-black">
        <h2 class="modern-bold text-4xl mb-6">
            How to Order
        </h2>

        <div class="text-left space-y-4 text-[11px] tracking-widest uppercase mb-10 border-l border-zinc-800 pl-4">
            <p>1. Add items to cart 🛒</p>
            <p>2. Fill in your details ✍️</p>
            <p>3. Checkout & copy your order 📲</p>
            <p>4. Paste it into our Instagram DMs ✨</p>
        </div>

        <button
            onclick="closeWelcome()"
            class="modern-bold bg-white text-black w-full py-5 text-lg hover:bg-zinc-300 transition">
            Start Shopping
        </button>
    </div>
</div>

<!-- HEADER -->
<header class="py-16 text-center">
    <h1 class="modern-bold text-6xl md:text-8xl mb-4">
        ZORA.ph
    </h1>

    <div class="flex flex-col items-center gap-3">
        <span class="text-lg italic text-gray-300 opacity-90">
            Premium Earring Collection
        </span>

        <div class="border border-gray-900 px-4 py-1">
            <span class="text-[10px] font-bold tracking-[0.2em] text-gray-400">
                Nationwide Shipping | Phippines
            </span>
        </div>
    </div>
</header>

<!-- SEARCH -->
<div class="max-w-md mx-auto mb-16 px-4">
    <input
        type="text"
        id="search-bar"
        onkeyup="filterStore()"
        placeholder="SEARCH COLLECTION..."
        class="w-full p-4 text-center font-bold text-xs tracking-widest uppercase">
</div>

<!-- SHOP GRID -->
<div
    class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-10 mb-24"
    id="shop-grid">
</div>

<!-- ADMIN PANEL -->
<section id="admin-panel" class="max-w-4xl mx-auto p-8 mb-24">

    <h2 class="modern-bold text-xl text-center mb-6 underline">
        Owner Management
    </h2>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
        <input type="text" id="add-name" placeholder="PRODUCT NAME" class="p-4">
        <input type="number" id="add-price" placeholder="PRICE (PHP)" class="p-4">
        <input type="number" id="add-stocks" placeholder="STOCK QUANTITY" class="p-4 md:col-span-2">
        <input type="text" id="add-img" placeholder="IMAGE URL" class="p-4 md:col-span-2">
        <textarea id="add-desc" placeholder="PRODUCT DESCRIPTION" class="p-4 md:col-span-2 h-24"></textarea>

        <button
            onclick="addNewProduct()"
            class="modern-bold bg-white text-black py-4 text-xl">
            Update Store
        </button>
    </div>

    <div
        id="inventory-list"
        class="space-y-2 border-t border-zinc-800 pt-6">
    </div>

    <button
        onclick="document.getElementById('admin-panel').style.display='none'"
        class="mt-4 w-full text-[10px] text-gray-600 uppercase">
        Close Panel
    </button>

</section>

<!-- FOOTER -->
<footer class="max-w-6xl mx-auto text-center mb-24 border-t border-zinc-900 pt-16">

    <p class="modern-bold text-xs text-gray-500 mb-6 uppercase">
        Payment Methods
    </p>

    <div class="flex justify-center gap-4 flex-wrap opacity-70 mb-10">
        <span class="payment-badge">GCASH</span>
        <span class="payment-badge">MAYA</span>
        <span class="payment-badge">BANK</span>
        <span class="payment-badge">COD</span>
    </div>

</footer>

<!-- CART BUTTON -->
<div id="cart-drawer" class="fixed bottom-8 right-8 z-50">
    <button
        onclick="toggleCart()"
        class="modern-bold bg-white text-black px-10 py-5 shadow-xl hover:scale-105 transition-transform text-xl">

        CART [
        <span id="cart-count">0</span>
        ]

    </button>
</div>

<!-- CART MODAL -->
<div
    id="cart-modal"
    class="fixed inset-0 bg-black/95 z-[100] hidden flex items-center justify-center p-4">

    <div class="border border-white w-full max-w-lg p-10 max-h-[90vh] flex flex-col overflow-y-auto">

        <div class="flex justify-between items-center mb-8">
            <h2 class="modern-bold text-3xl">
                Your Selection
            </h2>

            <button onclick="toggleCart()" class="text-white text-4xl">
                &times;
            </button>
        </div>

        <div
            id="cart-items"
            class="flex-grow overflow-y-auto space-y-6 mb-8 pr-2">
        </div>

        <div class="border-t border-zinc-800 pt-8 space-y-4">

            <input
                id="customer-name"
                type="text"
                placeholder="Full Name *"
                class="w-full p-4">

            <input
                id="customer-phone"
                type="text"
                placeholder="Phone Number *"
                class="w-full p-4">

            <textarea
                id="customer-address"
                placeholder="Shipping Address *"
                class="w-full p-4 h-24 resize-none"></textarea>

            <textarea
                id="customer-note"
                placeholder="Notes (Optional)"
                class="w-full p-4 h-20 resize-none"></textarea>

            <div class="flex justify-between items-center pt-4">
                <span class="modern-bold text-xl">
                    TOTAL
                </span>

                <span id="cart-total" class="modern-bold text-3xl">
                    PHP 0.00
                </span>
            </div>

            <button
                onclick="checkout()"
                class="modern-bold w-full bg-white text-black py-6 text-xl">

                Check Out

            </button>

        </div>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script src="zora.js"></script>

</body>
</html>
