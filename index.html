<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zora.ph | Official Earring Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000000; 
            color: #ffffff; 
            scroll-behavior: smooth;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        body::-webkit-scrollbar, #cart-items::-webkit-scrollbar { display: none; }

        .product-card { 
            background: #000000 !important; 
            border: 1px solid #222222 !important; 
            border-radius: 0px; 
            transition: all 0.3s ease-in-out;
            cursor: pointer;
        }
        .product-card:hover { 
            border-color: #ffffff !important; 
            background: #111111 !important; 
            transform: translateY(-4px);
        }

        .img-container {
            background-color: #ffffff;
            border-radius: 0px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #admin-panel {
            display: none; 
            background-color: #000000;
            border: 1px solid #ffffff;
            margin-top: 50px;
        }
        
        input { background: #000; border: 1px solid #333; color: white; border-radius: 0px; }
        input:focus { border-color: #ffffff; outline: none; }

        #thanks-banner {
            display: none;
            background: #ffffff;
            color: #000000;
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 60;
            letter-spacing: 2px;
        }

        .payment-badge {
            background: #000;
            padding: 5px 12px;
            font-size: 10px;
            font-weight: 900;
            border: 1px solid #333;
            letter-spacing: 1px;
        }
    </style>
</head>
<body class="p-4">

    <div id="thanks-banner">
        🎉 ORDER INITIATED! REDIRECTING TO INSTAGRAM...
        <button onclick="closeThanks()" class="ml-4 underline text-xs">CLOSE</button>
    </div>

    <header class="py-16 text-center">
        <h1 class="text-4xl font-black tracking-[0.4em] text-white uppercase mb-4">ZORA.PH</h1>
        <div class="flex flex-col items-center gap-3">
            <span class="text-[10px] tracking-[0.5em] text-gray-500 uppercase italic">Premium Earring Collection</span>
            <div class="inline-flex items-center gap-2 border border-gray-800 px-4 py-1">
                <span class="text-[9px] font-bold tracking-[0.2em] uppercase text-gray-400">LUCENA CITY, PH</span>
            </div>
        </div>
    </header>

    <div class="max-w-md mx-auto mb-16">
        <input type="text" id="search-bar" onkeyup="filterStore()" placeholder="SEARCH COLLECTION..." class="w-full p-4 text-center font-bold text-xs tracking-widest uppercase">
    </div>

    <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-10 mb-24" id="shop-grid"></div>

    <footer class="max-w-6xl mx-auto text-center mb-24 border-t border-zinc-900 pt-16">
        <p class="text-[10px] text-gray-500 uppercase tracking-[0.3em] mb-6">Payment Methods</p>
        <div class="flex justify-center gap-4 flex-wrap opacity-70">
            <span class="payment-badge">GCASH</span>
            <span class="payment-badge">MAYA</span>
            <span class="payment-badge">BANK</span>
            <span class="payment-badge">COD</span>
        </div>
    </footer>

    <section id="admin-panel" class="max-w-4xl mx-auto p-8 mb-24">
        <h2 class="text-sm font-black uppercase text-center mb-6 tracking-widest underline">Inventory Management</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
            <input type="text" id="add-name" placeholder="PRODUCT NAME" class="p-4">
            <input type="number" id="add-price" placeholder="PRICE (PHP)" class="p-4">
            <input type="text" id="add-img" placeholder="IMAGE URL (LINK)" class="p-4 md:col-span-2">
            <button onclick="addNewProduct()" class="bg-white text-black font-black py-4 uppercase tracking-widest hover:bg-gray-200 transition-all">Update Inventory</button>
        </div>
        <div id="inventory-list" class="space-y-2 border-t border-zinc-800 pt-6"></div>
        <button onclick="document.getElementById('admin-panel').style.display='none'" class="mt-4 w-full text-[10px] text-gray-600 uppercase tracking-widest">Close Panel</button>
    </section>

    <div id="cart-drawer" class="fixed bottom-8 right-8 z-50">
        <button onclick="toggleCart()" class="bg-white text-black px-10 py-5 font-black shadow-[0_0_20px_rgba(255,255,255,0.2)] flex items-center gap-4 hover:scale-105 transition-transform">
            MY BAG [<span id="cart-count">0</span>]
        </button>
    </div>

    <div id="cart-modal" class="fixed inset-0 bg-black/95 z-[100] hidden flex items-center justify-center p-4">
        <div class="border border-white w-full max-w-lg p-10 max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-2xl font-black uppercase tracking-tighter">Your Selection</h2>
                <button onclick="toggleCart()" class="text-white text-3xl font-light">&times;</button>
            </div>
            <div id="cart-items" class="flex-grow overflow-y-auto space-y-6 mb-8 pr-2" style="scrollbar-width: none;"></div>
            <div class="border-t border-zinc-800 pt-8 space-y-6">
                <div class="flex justify-between text-2xl font-black tracking-tighter">
                    <span>TOTAL</span>
                    <span id="cart-total">PHP 0.00</span>
                </div>
                <button onclick="checkout()" class="w-full bg-white text-black py-5 font-black uppercase tracking-[0.2em] hover:bg-gray-300 transition">Complete Purchase</button>
            </div>
        </div>
    </div>

    <script src="zora.js"></script>
</body>
</html>
